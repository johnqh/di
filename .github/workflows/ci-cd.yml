---
# CI/CD workflow for di
# Automatically publishes to NPM when NPM_TOKEN is configured

name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write      # For creating GitHub releases
  id-token: write      # For NPM provenance
  deployments: write   # For deployment tracking
  packages: write      # Publish to + consume from GitHub Packages (publish-target: github)

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@main
    secrets: inherit  # Pass all repository secrets
    with:
      publish-target: github   # publish @sudobility/di to GitHub Packages; consume @sudobility deps from it
